<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Password Strength Analyzer</title>
    <meta name="description" content="Advanced password strength analyzer with zxcvbn and HIBP breach detection.">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <!-- zxcvbn Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/zxcvbn/4.4.2/zxcvbn.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="background-blobs">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
    </div>

    <main class="glass-container">
        <header>
            <h1>Password Entropy</h1>
            <p>Advanced Strength Analyzer & Breach Detector</p>
        </header>

        <section class="input-section">
            <div class="input-wrapper">
                <input type="password" id="password-input" placeholder="Enter your password..." autocomplete="off">
                <button id="toggle-visibility" type="button" aria-label="Toggle password visibility">
                    <svg id="eye-icon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
                </button>
            </div>
            
            <div class="strength-meter-container">
                <div class="strength-meter-bar" id="strength-bar"></div>
            </div>
            <div class="strength-header">
                <span id="strength-text" class="strength-text">Strength: N/A</span>
                <span id="crack-time" class="crack-time"></span>
            </div>
        </section>

        <section class="feedback-section">
            <div id="warning-box" class="feedback-box warning hidden">
                <strong>⚠️ Warning:</strong> <span id="warning-text"></span>
            </div>
            <div id="suggestions-box" class="feedback-box suggestions hidden">
                <strong>💡 Suggestions:</strong>
                <ul id="suggestions-list"></ul>
            </div>
            <div id="success-box" class="feedback-box success hidden">
                ✅ This password looks great!
            </div>
        </section>

        <section class="actions-section">
            <button id="check-breach-btn" class="btn primary-btn">Check Data Breaches (HIBP)</button>
            <button id="generate-btn" class="btn secondary-btn">Generate Strong Password</button>
        </section>

        <div id="breach-result" class="breach-result hidden">
            <!-- Breach result injected via JS -->
        </div>
    </main>

    <script src="app.js"></script>
</body>
</html>
